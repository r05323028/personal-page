name: Deploy personal-page to r05323028.github.io

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm run build

      - name: Deploy to user pages repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PUSH_TOKEN }}
          external_repository: r05323028/r05323028.github.io
          publish_branch: main
          publish_dir: dist
          user_name: github-actions[bot]
          user_email: sean50301@gmail.com
          commit_message: "Deploy from personal-page @ ${{ github.sha }}"
